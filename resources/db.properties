# ShopSphere Database Configuration
# Default configuration for local MySQL 8.x
# Can be overridden using system environment variables:
# DB_URL, DB_USER, DB_PASSWORD, DB_DRIVER

db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/shopsphere?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.user=root
db.password=root

# Connection pool / timeout settings (in seconds)
db.timeout=5
